# One host per line. The name on the left (testhost) is how Ansible calls it,
# and host_vars/<name>.yml must be named after it.
#
# ansible_user is the account you log in as TODAY, not the one the role creates.
# On a brand new server that is usually root with a password: set
# ansible_user=root, drop ansible_ssh_private_key_file and see "First run on a
# new server" in the README.
#
# ansible_port must match the port sshd listens on right now. If you change
# security_ssh_port, update it here before the next run.

[app]
testhost ansible_host=203.0.113.10 ansible_user=user ansible_ssh_private_key_file=/path/to/private/key ansible_port=22

[defaults]
inventory = inventory.ini
roles_path = ./roles

[ssh_connection]
# StrictHostKeyChecking=accept-new: store the host key on the first connection
# without a prompt, and verify it on every connection after that. A changed key
# then aborts the connection.
#
# This trusts whoever answers the very first time. To rule that out, compare the
# fingerprint with the one your provider shows in its console before the first
# run. Do not replace this with host_key_checking = False: that drops the check
# for every host and every future run.
#
# ssh_args replaces the defaults instead of extending them, so ControlMaster and
# ControlPersist are repeated here: without them every task opens a new SSH
# connection.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s

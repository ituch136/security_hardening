# SPDX-License-Identifier: MIT
- name: Start and Enable ssh.service
  ansible.builtin.systemd:
    name: ssh.service
    state: started
    enabled: true

# Disabling ssh.socket so sshd runs as a plain service and a restart applies the new config
# (Tested on Yandex Cloud Ubuntu 22.04 LTS, self-hosted Ubuntu 24.04.
# On 22.04 the ssh.socket unit has Conflicts=ssh.service, so starting one unit kills the other.
# On 24.04 that Conflicts is gone, so the socket has to be stopped and disabled explicitly)

# systemd module has no way to check whether a unit exists,
# so systemctl is used here
- name: Check if ssh.socket exists
  ansible.builtin.command: # noqa: command-instead-of-module
    cmd: systemctl list-unit-files ssh.socket
  register: security_ssh_socket_unit
  changed_when: false
  failed_when: false

- name: Stop and Disable ssh.socket
  ansible.builtin.systemd:
    name: ssh.socket
    state: stopped
    enabled: false
  when:
    - "'ssh.socket' in security_ssh_socket_unit.stdout"

- name: Build ssh allowed users list
  ansible.builtin.set_fact:
    security_ssh_allow_users_effective: >-
      {{
      (([security_ansible_user_name] if security_manage_ansible_user | bool else [])
      + ([security_admin_user_name] if security_manage_admin_user | bool else [])
      + security_ssh_allow_users) | unique | join(' ') }}

- name: Warn about disabled lockout check
  ansible.builtin.debug:
    msg: >-
      Lockout check is disabled. User {{ ansible_user }} is not in AllowUsers
      and will lose SSH access once sshd restarts. Allow users list: {{ security_ssh_allow_users_effective }}
  when:
    - security_ssh_allow_lockout | bool
    - security_ssh_allow_users_effective | length > 0
    - ansible_user not in security_ssh_allow_users_effective.split(' ')

- name: Ensure current connection user is in allowed users list
  ansible.builtin.assert:
    that:
      - ansible_user in security_ssh_allow_users_effective.split(' ')
    fail_msg: "{{ ansible_user }} is not in allowed users. Set security_ssh_allow_lockout to true or add user to security_ssh_allow_users"
    quiet: true
  when:
    - security_ssh_allow_users_effective | length > 0 
  # If security_ssh_allow_users_effective is empty, then we allow all users, so no need to check current connection user
    - not security_ssh_allow_lockout | bool

- name: Deploy sshd configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: '0644'
    validate: '/usr/sbin/sshd -t -f %s'
  notify:
    - Restart sshd

- name: Get effective sshd configuration
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -T
  changed_when: false
  register: security_sshd_effective

- name: Verify effective sshd configuration
  ansible.builtin.assert:
    that:
      - ("port " ~ security_ssh_port) in security_sshd_effective.stdout_lines
      - ("permitrootlogin " ~ security_ssh_permit_root_login) in security_sshd_effective.stdout_lines
      - ("passwordauthentication " ~ security_ssh_password_authentication) in security_sshd_effective.stdout_lines
      - ("kbdinteractiveauthentication " ~ security_ssh_kbd_interactive_authentication) in security_sshd_effective.stdout_lines
    fail_msg: "Effective sshd config differs from role variables. Check other files in /etc/ssh/sshd_config.d"
    quiet: true

- name: Verify AllowUsers in effective sshd configuration
  ansible.builtin.assert:
    that:
      - ("allowusers " ~ item) in security_sshd_effective.stdout_lines
    fail_msg: "User {{ item }} is missing from effective AllowUsers"
    quiet: true
  loop: "{{ security_ssh_allow_users_effective.split() }}"

# The rule is opened before the restart: after it sshd listens on security_ssh_port,
# and with an active firewall a rule added later in ufw.yml would come too late.
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH port before sshd restart
  community.general.ufw:
    rule: allow
    port: "{{ security_ssh_port }}"
    proto: tcp

- name: Flush handlers (SSH)
  ansible.builtin.meta: flush_handlers

- name: Verify sshd listens on configured port
  ansible.builtin.wait_for:
    port: "{{ security_ssh_port }}"
    host: 127.0.0.1
    timeout: 10

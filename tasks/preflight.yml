- name: Validate ansible user variables
  ansible.builtin.assert:
    that:
      - security_ansible_user_name | length > 0
      - security_ansible_user_ssh_key | length > 0
    fail_msg: "You should set security_ansible_user_name and security_ansible_user_ssh_key variables in group_vars or host_vars"
    quiet: true
  when: security_manage_ansible_user | bool

- name: Validate admin user variables
  ansible.builtin.assert:
    that:
      - security_admin_user_name | length > 0
      - security_admin_user_ssh_key | length > 0
    fail_msg: "You should set security_admin_user_name and security_admin_user_ssh_key variables in group_vars or host_vars"
    quiet: true
  when: security_manage_admin_user | bool

- name: Validate admin password when sudo mode is not nopasswd
  ansible.builtin.assert:
    that:
      - security_admin_user_password | length > 0
    fail_msg: "You should set security_admin_user_password variable in group_vars or host_vars when security_admin_user_sudo_mode is not nopasswd"
    quiet: true
  when:
    - security_manage_admin_user | bool
    - security_admin_user_sudo_mode != "nopasswd"

- name: Validate ufw policy
  ansible.builtin.assert:
    that:
      - security_ufw_policy_incoming in ["allow", "deny", "reject"]
      - security_ufw_policy_outgoing in ["allow", "deny", "reject"]
    fail_msg: "security_ufw_policy_incoming and security_ufw_policy_outgoing should be one of 'allow', 'deny', 'reject'"
    quiet: true

- name: Validate admin sudo mode
  ansible.builtin.assert:
    that:
      - security_admin_user_sudo_mode in ["nopasswd", "passwd"]
    fail_msg: "security_admin_user_sudo_mode must be 'nopasswd' or 'passwd'"
    quiet: true
  when: security_manage_admin_user | bool

- name: Check sshd log file for file based backend
  ansible.builtin.stat:
    path: "{{ security_fail2ban_sshd_logpath }}"
  register: security_fail2ban_logpath_stat
  when:
    - security_fail2ban_sshd_enabled | bool
    - security_fail2ban_sshd_backend != "systemd"

- name: Validate sshd log file for file based backend
  ansible.builtin.assert:
    that:
      - security_fail2ban_logpath_stat.stat.exists
    fail_msg: "Backend '{{ security_fail2ban_sshd_backend }}' reads {{ security_fail2ban_sshd_logpath }}, but the file does not exist. Install rsyslog or set security_fail2ban_sshd_backend to 'systemd'"
    quiet: true
  when:
    - security_fail2ban_sshd_enabled | bool
    - security_fail2ban_sshd_backend != "systemd"
